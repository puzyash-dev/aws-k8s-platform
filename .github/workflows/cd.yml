name: CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy-to-aws:
    name: Build and Push to AWS ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials Manually
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set region ap-northeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin 717139594391.dkr.ecr.ap-northeast-1.amazonaws.com

      - name: Create ECR Repository if not exists
        run: |
          aws ecr describe-repositories --repository-name aws-k8s-app || aws ecr create-repository --repository-name aws-k8s-app

      - name: Build, tag, and push image to Amazon ECR
        run: |
          cd app
          docker build -t 717139594391.dkr.ecr.ap-northeast-1.amazonaws.com/aws-k8s-app:latest .
          docker push 717139594391.dkr.ecr.ap-northeast-1.amazonaws.com/aws-k8s-app:latest