replicaCount: 1

image:
  repository: 717139594391.dkr.ecr.ap-northeast-1.amazonaws.com/aws-k8s-app
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

env:
  PORT: "3000"
  DATABASE_URL: "postgresql://postgres:postgres@postgres-service:5432/appdb"
  REDIS_URL: "redis://redis-service:6379"

# Включаем встроенные компоненты для разработки (Postgres и Redis)
database:
  enabled: true
  image: "postgres:15-alpine"
  port: 5432

redis:
  enabled: true
  image: "redis:7-alpine"
  port: 6379

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi